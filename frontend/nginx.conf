# Upstream com keepalive - reutiliza conexões TCP com o backend
upstream backend_api {
    server backend:3001;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css text/javascript application/javascript application/json;

    # Cache assets estáticos por 1 ano
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # Proxy para API
    location /api/ {
        proxy_pass http://backend_api/;
        proxy_http_version 1.1;

        # Keepalive - reutiliza conexões abertas
        proxy_set_header Connection "";

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts mais tolerantes
        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        # Buffer para evitar erros com respostas grandes
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 8 16k;
    }

    # SPA - redireciona 404s para index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Permitir Let's Encrypt validar o domínio
    location ^~ /.well-known/ {
        allow all;
        try_files $uri =404;
    }

    # Bloquear acesso a outros arquivos ocultos
    location ~ /\.(?!well-known) {
        deny all;
    }
}

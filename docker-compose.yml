version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: appfinancas-backend
    environment:
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:-sua-chave-secreta-aqui}
      - PORT=3001
    volumes:
      - db_data:/app/data
    restart: unless-stopped
    networks:
      - appfinancas-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: appfinancas-frontend
    expose:
      - "80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - appfinancas-network

volumes:
  db_data:
    driver: local

networks:
  appfinancas-network:
    driver: bridge

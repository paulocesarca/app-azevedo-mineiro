version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: appfinancas-backend
    environment:
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:-sua-chave-secreta-aqui}
      - PORT=3001
    volumes:
      - db_data:/app/data
    restart: unless-stopped
    networks:
      - appfinancas-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/auth/me"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: appfinancas-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - appfinancas-network

volumes:
  db_data:
    driver: local

networks:
  appfinancas-network:
    driver: bridge
